name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Every six hours, check whether a friend has changed their share image.
    - cron: "17 */6 * * *"
    # Once a day, rebuild the whole site so the npm download counts on the home page stay
    # current. npm publishes a day's counts during the next day (UTC), so this runs late in it.
    # The jobs below name this cron where they tell the daily rebuild apart.
    - cron: "41 20 * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The six-hourly runs only: fetch friends' share images and compare them with the live site.
  # The site is rebuilt only when one has changed.
  friends:
    if: github.event_name == 'schedule' && github.event.schedule != '41 20 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: check
        run: node tools/friend-preview.mjs --all --og-only --live https://icons.kubai.design
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: friends
          path: site/public/friends

  # The site, on Cloudflare Pages. Analytics turns on only when the repository defines
  # these variables.
  cloudflare:
    needs: friends
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '41 20 * * *' || needs.friends.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Friends' preview images: fresh share images, and screenshots for sites without one.
      # A site that cannot be read keeps the image in the repository.
      - name: Install Chinese and Japanese fonts for screenshots
        if: github.event_name != 'schedule' || github.event.schedule == '41 20 * * *'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - name: Refresh friends' preview images
        if: github.event_name != 'schedule' || github.event.schedule == '41 20 * * *'
        run: node tools/friend-preview.mjs --all
      - name: Use the share images the check fetched
        if: github.event_name == 'schedule' && github.event.schedule != '41 20 * * *'
        uses: actions/download-artifact@v7
        with:
          name: friends
          path: site/public/friends
      - name: Build the packages and site data
        run: npm run build
      - name: Test
        run: npm test
      - name: Build the site
        run: npm run build -w site
        env:
          NEXT_PUBLIC_SITE_URL: https://icons.kubai.design
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      - name: Keep the sitemap that is live now
        run: curl -fsS https://icons.kubai.design/sitemap.xml -o previous-sitemap.xml || true
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=kubai-icons --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell search engines about new pages
        continue-on-error: true
        run: node tools/indexnow.mjs previous-sitemap.xml site/out/sitemap.xml
      # Google takes no IndexNow: when the sitemap changed, submit it through Search Console.
      # Without the GOOGLE_SERVICE_ACCOUNT secret this step only prints a note.
      - name: Submit the sitemap to Google
        continue-on-error: true
        run: node tools/google-sitemap.mjs previous-sitemap.xml site/out/sitemap.xml
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

  # The previous address, on GitHub Pages, forwards visitors to the site.
  # Without a status check, `if` also needs every earlier job to have succeeded, and the friends
  # job is skipped on pushes, so this job never ran. It now asks only that the site was published.
  forward-old-address:
    needs: cloudflare
    if: ${{ !cancelled() && needs.cloudflare.result == 'success' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the forwarding page
        run: |
          mkdir forward
          cp tools/forward.html forward/index.html
          cp tools/forward.html forward/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: forward
      - id: deployment
        uses: actions/deploy-pages@v5
